<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1033"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#1a1033" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon: purple rounded rect -->
  <rect x="422" y="210" width="96" height="96" rx="22" ry="22" fill="#7C3AED"/>

  <!-- White star (5-point) centered in the rect -->
  <polygon
    points="470,224 477.5,247 502,247 482.5,261 490,284 470,270 450,284 457.5,261 438,247 462.5,247"
    fill="white"
  />

  <!-- TickPick wordmark -->
  <text x="536" y="278" font-size="80" font-weight="800" font-family="Arial, sans-serif" fill="white">Tick</text>
  <text x="718" y="278" font-size="80" font-weight="800" font-family="Arial, sans-serif" fill="#F59E0B">Pick</text>

  <!-- Tagline -->
  <text x="600" y="338" font-size="22" font-weight="600" letter-spacing="5" text-anchor="middle" font-family="Arial, sans-serif" fill="#9CA3AF">PRIZE COMPETITIONS</text>
</svg>

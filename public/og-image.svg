<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1033"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#1a1033" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon: purple rounded rect -->
  <rect x="460" y="205" width="88" height="88" rx="22" ry="22" fill="#7C3AED"/>
  <!-- Star inside icon -->
  <text x="504" y="265" font-size="52" text-anchor="middle" fill="white">⭐</text>

  <!-- TickPick wordmark -->
  <text x="570" y="272" font-size="72" font-weight="800" font-family="system-ui, -apple-system, sans-serif" fill="#7C3AED">Tick</text>
  <text x="716" y="272" font-size="72" font-weight="800" font-family="system-ui, -apple-system, sans-serif" fill="#F59E0B">Pick</text>

  <!-- Tagline -->
  <text x="600" y="330" font-size="22" font-weight="600" letter-spacing="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#9CA3AF">PRIZE COMPETITIONS</text>
</svg>
